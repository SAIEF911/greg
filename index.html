
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kai AI</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Inter, Arial, sans-serif;
    }

    body {
      height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(circle at top left, rgba(255,255,255,0.35), transparent 30%),
        radial-gradient(circle at bottom right, rgba(255,255,255,0.2), transparent 25%),
        linear-gradient(135deg, #e7ecf2, #cfd8e3);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #111;
    }

    .noise {
      position: fixed;
      inset: 0;
      background-image:
        repeating-radial-gradient(circle at 0 0, transparent 0, rgba(255,255,255,0.04) 1px, transparent 2px);
      opacity: 0.5;
      pointer-events: none;
    }

    .app {
      width: 96%;
      max-width: 1400px;
      height: 94vh;
      border-radius: 34px;
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.35);
      box-shadow:
        0 10px 40px rgba(0,0,0,0.1),
        inset 0 0 0 1px rgba(255,255,255,0.15);
      overflow: hidden;
      display: flex;
    }

    .sidebar {
      width: 280px;
      background: rgba(255,255,255,0.08);
      border-right: 1px solid rgba(255,255,255,0.18);
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .logo {
      font-size: 40px;
      font-weight: 800;
      letter-spacing: -2px;
    }

    .tag {
      opacity: 0.6;
      margin-top: -10px;
      font-size: 13px;
    }

    .new-chat {
      border: none;
      padding: 16px;
      border-radius: 20px;
      background: rgba(255,255,255,0.35);
      cursor: pointer;
      font-size: 15px;
      transition: 0.3s;
      backdrop-filter: blur(20px);
    }

    .new-chat:hover {
      transform: translateY(-2px);
      background: rgba(255,255,255,0.5);
    }

    .history {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .chat-item {
      padding: 14px;
      border-radius: 16px;
      background: rgba(255,255,255,0.14);
      cursor: pointer;
      transition: 0.3s;
      font-size: 14px;
    }

    .chat-item:hover {
      background: rgba(255,255,255,0.25);
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .topbar {
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      border-bottom: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.05);
    }

    .topbar h1 {
      font-size: 20px;
      font-weight: 600;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      opacity: 0.7;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #00d26a;
      box-shadow: 0 0 15px #00d26a;
    }

    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 40px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .message {
      max-width: 75%;
      padding: 20px 24px;
      border-radius: 26px;
      line-height: 1.7;
      font-size: 15px;
      animation: fadeIn 0.4s ease;
      backdrop-filter: blur(20px);
    }

    .ai {
      align-self: flex-start;
      background: rgba(255,255,255,0.28);
      border: 1px solid rgba(255,255,255,0.35);
    }

    .user {
      align-self: flex-end;
      background: rgba(255,255,255,0.55);
      border: 1px solid rgba(255,255,255,0.4);
    }

    .input-area {
      padding: 24px;
      border-top: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.06);
    }

    .input-box {
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(255,255,255,0.25);
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 28px;
      padding: 14px 18px;
      backdrop-filter: blur(30px);
    }

    textarea {
      flex: 1;
      resize: none;
      border: none;
      outline: none;
      background: transparent;
      color: #111;
      font-size: 15px;
      min-height: 26px;
      max-height: 140px;
    }

    textarea::placeholder {
      color: rgba(0,0,0,0.5);
    }

    .send {
      width: 52px;
      height: 52px;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      font-size: 20px;
      background: rgba(255,255,255,0.7);
      transition: 0.3s;
      backdrop-filter: blur(20px);
    }

    .send:hover {
      transform: scale(1.08);
      background: white;
    }

    .typing {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .typing span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #111;
      animation: bounce 1.2s infinite;
    }

    .typing span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes bounce {
      0%, 80%, 100% {
        transform: scale(0.5);
        opacity: 0.4;
      }

      40% {
        transform: scale(1);
        opacity: 1;
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media(max-width: 900px) {
      .sidebar {
        display: none;
      }

      .message {
        max-width: 92%;
      }

      .chat-area {
        padding: 20px;
      }
    }
  </style>
</head>
<body>

  <div class="noise"></div>

  <div class="app">

    <div class="sidebar">
      <div>
        <div class="logo">Kai</div>
        <div class="tag">Minimal AI Interface</div>
      </div>

      <button class="new-chat" onclick="newChat()">
        + New Chat
      </button>

      <div class="history" id="history">
        <div class="chat-item">Creative Ideas</div>
        <div class="chat-item">Physics Notes</div>
        <div class="chat-item">Future Concepts</div>
      </div>
    </div>

    <div class="main">

      <div class="topbar">
        <h1>Kai AI Assistant</h1>

        <div class="status">
          <div class="dot"></div>
          Online
        </div>
      </div>

      <div class="chat-area" id="chatArea">

        <div class="message ai">
          Hello. I am Kai.<br><br>
          Your minimalist AI assistant interface is now active.
        </div>

      </div>

      <div class="input-area">
        <div class="input-box">

          <textarea
            id="prompt"
            placeholder="Message Kai..."
            rows="1"
          ></textarea>

          <button class="send" onclick="sendMessage()">
            ↑
          </button>

        </div>
      </div>

    </div>
  </div>

  <script>

    const chatArea = document.getElementById("chatArea");
    const promptInput = document.getElementById("prompt");

    // ==========================
    // API CONFIGURATION
    // ==========================

    const API_KEY = "PASTE_YOUR_API_KEY_HERE";

    // Example OpenAI-compatible endpoint
    const API_URL = "https://api.openai.com/v1/chat/completions";

    // ==========================

    let messages = [
      {
        role: "system",
        content: "You are Kai, a futuristic minimalist AI assistant."
      }
    ];

    function addMessage(text, type) {
      const msg = document.createElement("div");
      msg.className = `message ${type}`;
      msg.innerHTML = text.replace(/\n/g, "<br>");
      chatArea.appendChild(msg);
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    function showTyping() {
      const typing = document.createElement("div");
      typing.className = "message ai";
      typing.id = "typing";

      typing.innerHTML = `
        <div class="typing">
          <span></span>
          <span></span>
          <span></span>
        </div>
      `;

      chatArea.appendChild(typing);
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    function removeTyping() {
      const typing = document.getElementById("typing");
      if (typing) typing.remove();
    }

    async function sendMessage() {

      const text = promptInput.value.trim();

      if (!text) return;

      addMessage(text, "user");

      messages.push({
        role: "user",
        content: text
      });

      promptInput.value = "";

      showTyping();

      try {

        // ==========================
        // API REQUEST
        // ==========================

        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${API_KEY}`
          },

          body: JSON.stringify({
            model: "gpt-4.1-mini",
            messages: messages,
            temperature: 0.8
          })
        });

        const data = await response.json();

        removeTyping();

        const aiReply =
          data.choices?.[0]?.message?.content ||
          "No response received.";

        addMessage(aiReply, "ai");

        messages.push({
          role: "assistant",
          content: aiReply
        });

      } catch (error) {

        removeTyping();

        addMessage(
          "Connection error. API integration required.",
          "ai"
        );

        console.error(error);
      }
    }

    function newChat() {

      chatArea.innerHTML = `
        <div class="message ai">
          New conversation started.<br><br>
          How can Kai help you today?
        </div>
      `;

      messages = [
        {
          role: "system",
          content: "You are Kai, a futuristic minimalist AI assistant."
        }
      ];
    }

    // ENTER TO SEND

    promptInput.addEventListener("keydown", function(e) {

      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

  </script>
</body>
</html>
